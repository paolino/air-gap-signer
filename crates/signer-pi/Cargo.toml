[package]
name = "signer-pi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Raspberry Pi HAL: framebuffer display and GPIO buttons"

[[bin]]
name = "signer-pi-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "se051-probe"
path = "src/bin/se051-probe.rs"

[[bin]]
name = "se051-ed25519-check"
path = "src/bin/se051-ed25519-check.rs"

[[bin]]
name = "fido-probe"
path = "src/bin/fido-probe.rs"

[[bin]]
name = "signer-pi"
path = "src/bin/signer-pi.rs"

[dependencies]
signer-core = { path = "../signer-core" }
signer-hal = { path = "../signer-hal" }
fontdue = "0.9"
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
sha2.workspace = true
rand.workspace = true
ciborium.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.8"
se05x = { version = "0.4.2", default-features = false, features = ["embedded-hal-v1.0"] }
linux-embedded-hal = { version = "0.5", default-features = false, features = ["i2c"] }
embedded-hal = "1"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
hkdf = "0.12"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
i2cdev = "0.6"
