[package]
name = "signer-pi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Raspberry Pi HAL: framebuffer display and GPIO buttons"

[[bin]]
name = "signer-pi-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "se051-probe"
path = "src/bin/se051-probe.rs"

[[bin]]
name = "se051-ed25519-check"
path = "src/bin/se051-ed25519-check.rs"

[[bin]]
name = "fido-probe"
path = "src/bin/fido-probe.rs"

[[bin]]
name = "se051-keys"
path = "src/bin/se051-keys.rs"

[[bin]]
name = "signer-pi"
path = "src/bin/signer-pi.rs"

[dependencies]
cardano-tx = { path = "../../interpreters/cardano-tx" }
panel-input = { path = "../panel-input" }
signer-core = { path = "../signer-core" }
signer-hal = { path = "../signer-hal" }
fontdue = "0.9"
serde_json.workspace = true
serde.workspace = true
blake2.workspace = true
pallas-codec = "1.4"
hex.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true
sha2.workspace = true
rand.workspace = true
ciborium.workspace = true
clap.workspace = true

tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.8"
rustix = { version = "1", features = ["time"] }
se05x = { version = "0.4.2", default-features = false, features = ["embedded-hal-v1.0"] }
iso7816 = "0.2.2"
zeroize.workspace = true
linux-embedded-hal = { version = "0.5", default-features = false, features = ["i2c"] }
embedded-hal = "1"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
hkdf = "0.12"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
miniz_oxide = "0.8"
unicode-normalization = "0.1"
i2cdev = "0.6"
signer-link = { path = "../signer-link" }
bluer = { version = "0.17.4", features = ["bluetoothd"] }
dbus = { version = "0.9", features = ["vendored"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
