[package]
name = "usb-pack"
default-run = "usb-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool to prepare USB stick contents for air-gapped signing"

[[bin]]
name = "usb-pack"
path = "src/main.rs"

[dependencies]
signer-core = { path = "../signer-core" }
ciborium.workspace = true
serde.workspace = true
clap = { version = "4", features = ["derive"] }
hex.workspace = true
serde_json.workspace = true
pallas-codec = "1.4"
pallas-primitives = "1.4"
ed25519-dalek.workspace = true
tempfile = "3"
