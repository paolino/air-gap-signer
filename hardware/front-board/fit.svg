<svg xmlns="http://www.w3.org/2000/svg" width="151mm" height="228mm" viewBox="0 0 151 228">
  <title>Air Gap Signer front board and enclosure fit</title>
  <desc>Nominal 1:1 plan and side views with a removable base cover for servicing the installed boot microSD.</desc>
  <defs>
    <marker id="arrow" markerWidth="3" markerHeight="3" refX="2.6" refY="1.5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0l3 1.5L0 3z" fill="#16647b"/>
    </marker>
  </defs>
  <rect width="151" height="228" fill="#fff"/>
  <g font-family="sans-serif" fill="#202c37" font-size="2.65">
    <text x="11" y="7" font-weight="bold" font-size="3.6">Air Gap Signer front board</text>
    <text x="11" y="11.5">Nominal fit · print at 100% · dimensions in mm</text>
    <g transform="translate(11 17)">
      <rect width="105" height="62" rx="2" fill="#edf1f4" stroke="#202c37" stroke-width=".35"/>
      <rect x="2" y="3.37" width="84.52" height="55.26" fill="#b9c9d6" fill-opacity=".76"
            stroke="#406382" stroke-width=".3"/>
      <rect x="7.54" y="6.52" width="73.44" height="48.96" rx=".25" fill="#19354c"/>
      <g text-anchor="middle">
        <text x="44.26" y="29.5" fill="#fff" font-size="4.3" font-weight="bold">3.5″ IPS</text>
        <text x="44.26" y="35" fill="#fff">480 × 320 active pixels</text>
        <text x="44.26" y="41" fill="#cbdeeb">84.52 × 55.26 mm panel</text>
        <text x="96" y="7.7" font-size="2.4">NAV</text>
        <text x="96" y="41.9" font-size="2.4">CONFIRM</text>
        <text x="96" y="56.7" font-size="2.4">MODE</text>
      </g>
      <path d="M93 11h6v4h4v6h-4v4h-6v-4h-4v-6h4z" stroke="#252f38"
            stroke-width=".25" fill="#f9fafb"/>
      <rect x="89" y="31" width="14" height="7" rx="1.2" stroke="#407151" stroke-width=".25"
            fill="#d1e7d8"/>
      <rect x="89" y="46" width="14" height="7" rx="1.2" stroke="#546679" stroke-width=".25"
            fill="#e5ebf2"/>
      <g fill="none" stroke="#86acbf" stroke-width=".32" stroke-dasharray="1.3 .9">
        <rect x="20" y="6" width="85" height="56" rx="3"/>
        <circle cx="23.5" cy="9.5" r="1.375"/>
        <circle cx="81.5" cy="9.5" r="1.375"/>
        <circle cx="23.5" cy="58.5" r="1.375"/>
        <circle cx="81.5" cy="58.5" r="1.375"/>
      </g>
      <g fill="none" stroke="#94652c" stroke-width=".35" stroke-dasharray=".8 .6">
        <circle cx="7" cy="9" r="4"/>
        <circle cx="98" cy="9" r="4"/>
        <circle cx="7" cy="54" r="4"/>
        <circle cx="98" cy="54" r="4"/>
      </g>
      <g fill="none" stroke="#16647b" stroke-width=".45" marker-end="url(#arrow)">
        <path d="M105 15h9"/>
        <path d="M105 33h9"/>
        <path d="M105 50.5h9"/>
        <path d="M30.6 62v9"/>
        <path d="M52 62v9"/>
        <path d="M73.5 62v9"/>
      </g>
      <g fill="#16647b" font-size="2.5">
        <text x="116" y="15.9">USB-A ×2</text>
        <text x="116" y="33.9">USB-A ×2</text>
        <text x="116" y="51.4">Ethernet</text>
        <text x="30.6" y="75" text-anchor="middle">Micro-USB power</text>
        <text x="52" y="75" text-anchor="middle">HDMI</text>
        <text x="73.5" y="75" text-anchor="middle">A/V</text>
      </g>
      <path d="M0 79v2m0-1h105m0-1v2 M135 0h2m-1 0v62m-1 0h2" fill="none"
            stroke="#202c37" stroke-width=".25"/>
      <text x="52.5" y="84" text-anchor="middle">105 mm</text>
      <text x="139" y="31" text-anchor="middle" transform="rotate(-90 139 31)">62 mm</text>
    </g>
    <text x="11" y="105.5" font-size="2.35">Blue dashes show the Pi. Brown circles show the feet.</text>
    <text x="11" y="112" font-weight="bold">Side view · prototype stack</text>
    <g transform="translate(11 119)">
      <path d="M2 2.4V0h84.52v2.4" fill="#b9c9d6" stroke="#406382" stroke-width=".26"/>
      <rect y="2.4" width="105" height="1.6" fill="#edf1f4" stroke="#202c37" stroke-width=".3"/>
      <rect x="20" y="24" width="85" height="1.6" fill="#c1d8cb" stroke="#405f52" stroke-width=".3"/>
      <rect x="88" y="8" width="19" height="16" fill="#d7e0e8" stroke="#44617a" stroke-width=".3"/>
      <g stroke="#16647b" stroke-width=".45" marker-end="url(#arrow)">
        <path d="M106.5 14h8.5"/>
        <path d="M106.5 20.5h8.5"/>
      </g>
      <rect x="21.5" y="25.6" width="4" height="4.9" fill="none" stroke="#94652c"
            stroke-width=".24" stroke-dasharray=".65 .45"/>
      <rect x="79.5" y="25.6" width="4" height="4.9" fill="#f0dbc0" stroke="#94652c" stroke-width=".24"/>
      <path d="M0 4v26.5h105" stroke="#202c37" stroke-width="1.1"/>
      <path d="M3 31v7.5q4 3 8 0V31z" fill="#f0dbc0" fill-opacity=".4"
            stroke="#94652c" stroke-width=".3" stroke-dasharray=".65 .45"/>
      <path d="M94 31v7.5q4 3 8 0V31z" fill="#f0dbc0" stroke="#94652c" stroke-width=".3"/>
      <rect x="17" y="26" width="10" height="1" fill="#16647b"/>
      <text x="3" y="27.6" fill="#16647b" font-size="2.3">microSD</text>
      <path d="M32 4v20m-1.3-20h2.6m-2.6 20h2.6" stroke="#44617a" stroke-width=".24"/>
      <text x="34" y="14.8" font-size="2.4">20 mm target</text>
      <text x="34" y="18.5" font-size="2.3">Pi top to front PCB underside</text>
      <text x="97.5" y="12" text-anchor="middle" font-size="2.35">USB</text>
      <text x="97.5" y="23" text-anchor="middle" font-size="2.2">16 mm</text>
      <text x="13" y="35.8" font-size="2.35">Removable base cover</text>
      <text x="70" y="41.6" font-size="2.35">8 mm nominal feet</text>
    </g>
    <path d="M11 165h10m-10-.65v1.3m10-1.3v1.3" stroke="#202c37" stroke-width=".25"/>
    <text x="23" y="166">10 mm</text>
    <text x="37" y="166" font-size="2.3">Supports and plug-body clearances need a physical fit check.</text>
    <text x="11" y="173" font-weight="bold">Boot microSD · service access</text>
    <text x="11" y="178">Leave the boot card installed during everyday use.</text>
    <text x="11" y="182.5">Power off and open the base cover to replace or reimage the card.</text>
    <text x="11" y="192" font-weight="bold">Rear-wall camera · bench fit target</text>
    <rect x="11" y="196" width="25" height="24" fill="#d8e8df" stroke="#405f52" stroke-width=".3"/>
    <text x="23.5" y="207" text-anchor="middle" font-size="2.4">Camera PCB</text>
    <text x="23.5" y="212" text-anchor="middle" font-size="2.4">25 × 24 mm</text>
    <rect x="40" y="196" width="11.5" height="24" fill="#edf1f4" stroke="#405f52" stroke-width=".3"/>
    <text x="45.75" y="209" text-anchor="middle" font-size="2.35">11.5</text>
    <text x="56" y="201">Mount facing out of the rear wall, opposite HDMI.</text>
    <text x="56" y="207">Module envelopes shown at 1:1. Allow extra space</text>
    <text x="56" y="212">for the CSI ribbon and the rear mounting pocket.</text>
    <text x="56" y="218">Set aperture and fasteners from the supplier drawing.</text>
  </g>
</svg>
