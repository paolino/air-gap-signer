<svg xmlns="http://www.w3.org/2000/svg" width="138mm" height="135mm" viewBox="0 0 138 135" font-family="sans-serif">
<title>Square front-panel study</title>
<desc>Nominal 80 mm square user interface centred in a one-piece 92 mm square lid. Dashed outlines indicate hidden component envelopes.</desc>
<rect width="138" height="135" fill="white"/>
<g transform="translate(6 14)" stroke-linejoin="round">
<rect id="lid" width="92" height="92" rx="4" fill="#e7e9e7" stroke="#304047" stroke-width=".45"/>
<rect id="face" x="6" y="6" width="80" height="80" fill="none" stroke="#49677d" stroke-width=".35" stroke-dasharray="1 .8"/>
<rect id="lcd" x="3.74" y="4" width="84.52" height="55.26" fill="none" stroke="#718a97" stroke-width=".3" stroke-dasharray="1 .8"/>
<rect id="display" x="9.28" y="7.15" width="73.44" height="48.96" rx=".5" fill="#223a46"/>
<g text-anchor="middle" fill="#fff"><text x="46" y="30" font-size="4">3.5″ display</text><text x="46" y="36" font-size="2.7">480 × 320</text></g>
<circle id="spare" cx="11" cy="74" r="3.5" fill="none" stroke="#66777a" stroke-width=".3" stroke-dasharray=".8 .6"/>
<path id="joystick" d="M20 67h6v4h4v6h-4v4h-6v-4h-4v-6h4z" fill="#4d6066"/>
<rect id="camera" x="33.5" y="62" width="25" height="24" rx="1" fill="none" stroke="#337963" stroke-width=".4" stroke-dasharray="1 .8"/>
<circle id="lens" cx="46" cy="74" r="3.6" fill="#263e46"/><circle cx="46" cy="74" r="2" fill="#547586"/>
<rect id="confirm" x="61" y="70" width="12" height="8" rx="2" fill="#567457"/>
<circle id="mode" cx="80" cy="74" r="4" fill="#4d6066"/>
<g font-size="2.4" fill="#283b43" text-anchor="middle"><text x="11" y="82.5">Spare*</text><text x="23" y="85">Joystick</text><text x="46" y="82.5">Camera</text><text x="67" y="82.5">Confirm</text><text x="80" y="82.5">Mode</text></g>
</g>
<g fill="#283b43"><text x="6" y="8.5" font-size="4" font-weight="bold">Front-panel fit study</text>
<text x="101" y="25" font-size="3">92 × 92 lid</text><text x="101" y="31" font-size="2.5">continuous rim</text><text x="101" y="54" font-size="3">80 × 80 face</text><text x="101" y="60" font-size="2.5">blue dashes</text><text x="101" y="88" font-size="2.5">* Optional button</text>
<text x="6" y="113" font-size="2.6">Hidden LCD and camera outlines are dashed. Lens aperture is indicative.</text>
<text x="6" y="119" font-size="2.6">All dimensions in mm. Wall, bosses, connector fit and clearances need a mock-up.</text>
<path d="M6 127h10m-10-.8v1.6m10-1.6v1.6" stroke="#283b43" stroke-width=".3"/><text x="18" y="128" font-size="2.5">10 mm · print at 100%</text></g>
</svg>
